[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "live2note"
version = "0.1.2"
description = "Live stream knowledge capture agent — record, transcribe, organize, export."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "live2note contributors" }]
keywords = ["live-stream", "transcription", "knowledge", "whisper", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typer[all]>=0.9",
    "pyyaml>=6.0",
    "rich>=13.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.4"]
whisper = ["faster-whisper>=1.0"]

[project.scripts]
live2note = "live2note.cli:app"

[project.urls]
Homepage = "https://github.com/yourname/live2note"
Repository = "https://github.com/yourname/live2note"
Issues = "https://github.com/yourname/live2note/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/live2note"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # typer.Option/Argument in defaults — required by Typer
]

[tool.ruff.lint.isort]
known-first-party = ["live2note"]
