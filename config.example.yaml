# live2note configuration
# Copy to ~/.live2note/config.yaml or ./live2note.yaml and edit as needed.
# Generate with: live2note config-init

# ── Recording ──────────────────────────────────────────────
recording:
  segment_duration: 5          # minutes per audio segment
  audio_format: "wav"
  audio_sample_rate: 16000     # whisper optimal sample rate
  audio_channels: 1            # mono
  ffmpeg_path: "ffmpeg"        # path to ffmpeg binary
  stop_grace_seconds: 10       # seconds to wait for graceful ffmpeg stop
  no_data_timeout_seconds: 180 # stop if no new segment within this time
  live_check_interval_seconds: 60  # how often to check if stream is still live
  max_live_check_failures: 3   # consecutive failures before auto-stop

# ── Transcription ──────────────────────────────────────────
transcription:
  model_size: "large-v3"       # tiny | base | small | medium | large-v3
  language: "zh"               # language code (zh, en, ja, ...)
  device: "auto"               # auto | cpu | cuda
  compute_type: "auto"         # auto | int8 | float16 | float32
  beam_size: 5
  vad_filter: true             # voice activity detection
  initial_prompt: ""           # initial prompt / context for whisper
  glossary: []                 # hotwords / glossary list (space-separated)
  word_timestamps: false       # enable word-level timestamps

# ── Speaker Diarization ────────────────────────────────────────
# Diarization identifies "who spoke when" in the recording.
# Requires pyannote.audio and a Hugging Face auth token:
#   pip install pyannote.audio
#   export HUGGING_FACE_HUB_TOKEN=hf_...
#
# This is OPTIONAL — normal transcription works without it.
diarization:
  enabled: false
  model: "pyannote/speaker-diarization-3.1"
  auth_token_env: "HUGGING_FACE_HUB_TOKEN"
  num_speakers: 0              # 0 = auto-detect
  device: "auto"

# ── LLM Configuration ─────────────────────────────────────
# live2note 默认使用 external_cli 模式。
# 不需要单独配置 API Key，只需本机有一个已登录的 Agent CLI。
#
# 默认工作方式：
#   live2note → 构建 prompt → claude -p (stdin) → stdout → 解析为知识笔记
#
# 如果你使用其他 Agent CLI（codex / opencode / openclaw / hermes 等），
# 修改 external_cli.command 和 args 即可。
# 如果你想用 API Key 模式，显式设置 provider: openai_compatible 或 anthropic。
#
# Set provider to one of: external_cli | openai_compatible | anthropic | prompt_only | none
llm:
  provider: external_cli
  temperature: 0.2
  max_tokens: 4096

  # ── 模式 1（默认）：External CLI ──────────────────────
  # 将 prompt 通过 stdin 传给外部命令，读取 stdout 作为响应。
  # 重要：live2note 不会读取任何 Agent 的内部认证文件。
  #       它只是把 prompt 管道传输给外部命令，就像你在终端中手动输入一样。
  external_cli:
    enabled: true
    command: "claude"             # codex / opencode / openclaw / hermes / cg
    args: ["-p"]                 # codex 用 ["exec"]，opencode 用 []
    timeout_seconds: 600
    input_mode: stdin
    fallback_to_prompt_only: true

  # ── 模式 2：Prompt Only（降级兜底）───────────────────
  # external_cli 不可用时自动降级到此模式。
  # 将 prompt 写入文件，用户可手动复制到任意 LLM 处理。
  prompt_only:
    enabled: true
    output_dir: prompts

  # ── 模式 3：OpenAI 兼容 API（需显式启用）─────────────
  openai_compatible:
    enabled: false
    api_base: "https://api.openai.com/v1"
    model: "gpt-4o"
    api_key_env: "OPENAI_API_KEY"

  # ── 模式 4：Anthropic API（需显式启用）───────────────
  anthropic:
    enabled: false
    model: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"

# ── getnote integration ────────────────────────────────────
getnote:
  enabled: false               # set true to auto-import after processing
  command: 'getnote save'  # content passed directly as positional arg
  default_tags:
    - "live2note"
  timeout: 60                  # seconds

# ── Output ─────────────────────────────────────────────────
output:
  base_dir: ""                 # blank = ~/.live2note/data/tasks
  keep_audio: true
  keep_intermediate: true

# ── Platform overrides ─────────────────────────────────────
platforms:
  bilibili:
    quality: "best"
  douyin:
    quality: "best"
